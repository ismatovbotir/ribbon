  <text x="185" y="205" fill="#3F3F46" font-size="15" text-anchor="middle">Нагрев в середине головки.</text>
  <text x="185" y="227" fill="#3F3F46" font-size="15" text-anchor="middle">Подходят wax, wax-resin и resin.</text>
  <text x="535" y="205" fill="#3F3F46" font-size="15" text-anchor="middle">Нагрев ближе к заднему краю.</text>
  <text x="535" y="227" fill="#3F3F46" font-size="15" text-anchor="middle">Обычно wax-resin и resin, в TTO тоже.</text>
  <rect x="250" y="248" width="14" height="10" fill="#2563EB"/><text x="270" y="258" fill="#3F3F46" font-size="13">зона нагрева (схема)</text>
