<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-label="Плоская термоголовка и головка near-edge" font-family="Inter, Arial, sans-serif">
  <rect width="720" height="270" fill="#FFFFFF"/>
  <text x="185" y="30" fill="#18181B" font-size="18" font-weight="700" text-anchor="middle">Flat head (плоская)</text>
  <text x="535" y="30" fill="#18181B" font-size="18" font-weight="700" text-anchor="middle">Near-edge (у края)</text>
  <rect x="85" y="55" width="200" height="56" fill="#27272A"/>
  <rect x="172" y="104" width="26" height="9" fill="#2563EB"/>
  <path d="M40 116 H330" stroke="#18181B" stroke-width="5"/>
  <circle cx="185" cy="146" r="28" fill="#D4D4D8" stroke="#71717A"/>
  <rect x="435" y="55" width="200" height="56" fill="#27272A"/>
  <rect x="604" y="104" width="26" height="9" fill="#2563EB"/>
