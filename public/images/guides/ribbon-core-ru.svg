<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Размеры риббона: ширина ленты, ширина втулки и внутренний диаметр втулки" font-family="Inter, Arial, sans-serif">
  <rect width="720" height="300" fill="#FFFFFF"/>
  <rect x="110" y="110" width="360" height="24" fill="#71717A"/>
  <rect x="190" y="60" width="200" height="124" fill="#18181B"/>
  <text x="290" y="128" fill="#FFFFFF" font-size="15" font-weight="600" text-anchor="middle">Лента</text>
  <path d="M190 40 H390 M190 34 V46 M390 34 V46" stroke="#2563EB" stroke-width="2" fill="none"/>
  <text x="290" y="28" fill="#1E3A8A" font-size="15" font-weight="600" text-anchor="middle">Ширина ленты, например 60 мм</text>
  <path d="M110 214 H470 M110 208 V220 M470 208 V220" stroke="#2563EB" stroke-width="2" fill="none"/>
  <text x="290" y="242" fill="#1E3A8A" font-size="15" font-weight="600" text-anchor="middle">Ширина втулки, например 110 мм</text>
  <text x="290" y="266" fill="#3F3F46" font-size="14" text-anchor="middle">Бывает больше ширины ленты</text>
  <circle cx="600" cy="122" r="62" fill="#18181B"/>
  <circle cx="600" cy="122" r="26" fill="#71717A"/>
  <circle cx="600" cy="122" r="17" fill="#FFFFFF"/>
  <path d="M583 122 H617" stroke="#2563EB" stroke-width="2"/>
  <text x="600" y="214" fill="#1E3A8A" font-size="15" font-weight="600" text-anchor="middle">Внутренний диаметр</text>
  <text x="600" y="238" fill="#3F3F46" font-size="14" text-anchor="middle">0,5" настольные</text>
  <text x="600" y="258" fill="#3F3F46" font-size="14" text-anchor="middle">1" промышленные</text>
</svg>
